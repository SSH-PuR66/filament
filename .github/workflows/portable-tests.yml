name: Portable tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-signing-and-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install offline test dependencies
        run: python -m pip install --disable-pip-version-check cryptography certifi
      - name: Test Apple signing primitives
        run: python -B test_signing.py
      - name: Test portable Filament paths
        run: python -B test_filament.py --portable
