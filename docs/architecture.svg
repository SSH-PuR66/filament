<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-label="Reading the screen and launching apps need no signing identity; only tapping inside an app does.">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#768390"/>
    </marker>
    <marker id="arwg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#e3b341"/>
    </marker>
  </defs>

  <rect width="1200" height="660" fill="#0c1218"/>

  <text x="48" y="56" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif"
        font-size="30" font-weight="600" fill="#e6edf3">One cable, three kinds of request</text>
  <text x="48" y="90" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif"
        font-size="21" fill="#8b949e">Only the third needs a certificate. That is the whole shape of the project.</text>

  <!-- ============ host ============ -->
  <rect x="48" y="140" width="250" height="300" rx="10" fill="#11181f" stroke="#30363d" stroke-width="2"/>
  <text x="72" y="180" font-family="ui-monospace,Consolas,monospace" font-size="19" fill="#768390" letter-spacing="2">WINDOWS</text>

  <rect x="72" y="200" width="202" height="58" rx="7" fill="#0c1218" stroke="#3d444d" stroke-width="1.5"/>
  <text x="90" y="236" font-family="ui-monospace,Consolas,monospace" font-size="23" fill="#e6edf3">flow.py</text>

  <rect x="72" y="272" width="202" height="58" rx="7" fill="#0c1218" stroke="#3d444d" stroke-width="1.5"/>
  <text x="90" y="308" font-family="ui-monospace,Consolas,monospace" font-size="23" fill="#e6edf3">launch.py</text>

  <rect x="72" y="344" width="202" height="58" rx="7" fill="#0c1218" stroke="#3d444d" stroke-width="1.5"/>
  <text x="90" y="380" font-family="ui-monospace,Consolas,monospace" font-size="23" fill="#e6edf3">inspect_ui.py</text>

  <!-- ============ transport ============ -->
  <rect x="392" y="212" width="182" height="156" rx="10" fill="#11181f" stroke="#30363d" stroke-width="2"/>
  <text x="416" y="252" font-family="ui-monospace,Consolas,monospace" font-size="19" fill="#768390" letter-spacing="2">TUNNEL</text>
  <text x="416" y="292" font-family="ui-monospace,Consolas,monospace" font-size="21" fill="#adbac7">go-ios</text>
  <text x="416" y="326" font-family="ui-monospace,Consolas,monospace" font-size="21" fill="#adbac7">pymobile-</text>
  <text x="416" y="352" font-family="ui-monospace,Consolas,monospace" font-size="21" fill="#adbac7">device3</text>

  <path d="M298 290 H 386" stroke="#768390" stroke-width="2.5" marker-end="url(#arw)"/>
  <text x="304" y="278" font-family="ui-monospace,Consolas,monospace" font-size="18" fill="#768390">USB</text>

  <!-- ============ device services ============ -->
  <path d="M574 240 H 668" stroke="#768390" stroke-width="2.5" marker-end="url(#arw)"/>
  <path d="M574 290 H 668" stroke="#768390" stroke-width="2.5" marker-end="url(#arw)"/>
  <path d="M574 340 C 620 340, 630 430, 668 430" fill="none" stroke="#e3b341" stroke-width="2.5" marker-end="url(#arwg)"/>

  <!-- 1: read -->
  <rect x="678" y="140" width="474" height="120" rx="10" fill="#11181f" stroke="#238636" stroke-width="2"/>
  <text x="702" y="180" font-family="ui-monospace,Consolas,monospace" font-size="24" fill="#e6edf3">read the element tree</text>
  <text x="702" y="212" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="20" fill="#8b949e">axAuditDaemon — captions, traits, identifiers</text>
  <text x="702" y="242" font-family="ui-monospace,Consolas,monospace" font-size="21" font-weight="600" fill="#3fb950">no certificate</text>

  <!-- 2: launch -->
  <rect x="678" y="276" width="474" height="120" rx="10" fill="#11181f" stroke="#238636" stroke-width="2"/>
  <text x="702" y="316" font-family="ui-monospace,Consolas,monospace" font-size="24" fill="#e6edf3">launch any app</text>
  <text x="702" y="348" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="20" fill="#8b949e">coredevice.appservice — a system service</text>
  <text x="702" y="378" font-family="ui-monospace,Consolas,monospace" font-size="21" font-weight="600" fill="#3fb950">no certificate</text>

  <!-- 3: tap -->
  <rect x="678" y="412" width="474" height="140" rx="10" fill="#11181f" stroke="#9e6a03" stroke-width="2"/>
  <text x="702" y="452" font-family="ui-monospace,Consolas,monospace" font-size="24" fill="#e6edf3">tap inside an app</text>
  <text x="702" y="484" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="20" fill="#8b949e">perform_press reaches only processes carrying</text>
  <text x="702" y="510" font-family="ui-monospace,Consolas,monospace" font-size="20" fill="#8b949e">task_for_pid-allow</text>
  <text x="702" y="540" font-family="ui-monospace,Consolas,monospace" font-size="21" font-weight="600" fill="#e3b341">needs a signing identity</text>

  <!-- the consequence -->
  <rect x="48" y="486" width="526" height="66" rx="10" fill="#11181f" stroke="#30363d" stroke-width="2"/>
  <text x="72" y="514" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="20" fill="#8b949e">Because launching is free, <tspan fill="#e6edf3">launch → read → expect</tspan></text>
  <text x="72" y="540" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="20" fill="#8b949e">drives the phone across apps with nothing signed.</text>

  <path d="M48 588 H 1152" stroke="#21262d" stroke-width="2"/>
  <text x="48" y="622" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="19" fill="#6e7681">Established by running it against an iPhone 17 on iOS 26.6 — appleid.py mints the identity the third row needs.</text>
</svg>
