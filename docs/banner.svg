<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Filament — drive a physically connected iPhone from Windows">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f14"/>
      <stop offset="55%" stop-color="#0e141b"/>
      <stop offset="100%" stop-color="#11181f"/>
    </linearGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1f6feb" stop-opacity="0"/>
      <stop offset="18%" stop-color="#1f6feb"/>
      <stop offset="50%" stop-color="#e3b341"/>
      <stop offset="82%" stop-color="#3fb950"/>
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-200%" width="200%" height="500%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#30363d" stop-opacity="0"/>
      <stop offset="50%" stop-color="#30363d"/>
      <stop offset="100%" stop-color="#30363d" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>

  <!-- faint grid, so the card reads as an instrument panel rather than a poster -->
  <g stroke="#1b232c" stroke-width="1">
    <path d="M0 80h1200M0 160h1200M0 240h1200"/>
    <path d="M200 0v320M400 0v320M600 0v320M800 0v320M1000 0v320"/>
  </g>

  <!-- the filament: host on the left, device on the right, one live wire between -->
  <path d="M150 250 C 380 250, 420 196, 600 196 S 820 250, 1050 250"
        fill="none" stroke="url(#wire)" stroke-width="2.5" filter="url(#glow)"/>

  <!-- host -->
  <g transform="translate(96,232)">
    <rect x="0" y="0" width="58" height="36" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
    <path d="M-8 40h74" stroke="#30363d" stroke-width="3" stroke-linecap="round"/>
    <text x="29" y="22" font-family="ui-monospace,SFMono-Regular,Consolas,monospace"
          font-size="11" fill="#7d8590" text-anchor="middle">win</text>
  </g>

  <!-- device -->
  <g transform="translate(1036,222)">
    <rect x="0" y="0" width="34" height="58" rx="7" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
    <rect x="11" y="4" width="12" height="3" rx="1.5" fill="#30363d"/>
    <circle cx="17" cy="46" r="1.8" fill="#3fb950"/>
  </g>

  <text x="80" y="128" font-family="ui-monospace,SFMono-Regular,Consolas,monospace"
        font-size="76" font-weight="600" fill="#e6edf3" letter-spacing="-2">filament</text>

  <text x="84" y="168" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif"
        font-size="21" fill="#8b949e">Drive a physically connected iPhone from Windows.</text>
  <text x="84" y="196" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif"
        font-size="21" fill="#6e7681">No Mac. No Xcode. No jailbreak. No admin.</text>

  <path d="M80 216h1040" stroke="url(#fade)" stroke-width="1"/>

  <g font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12.5" fill="#6e7681">
    <text x="84" y="252">read the element tree</text>
    <text x="266" y="252">·</text>
    <text x="288" y="252">launch any app</text>
    <text x="424" y="252">·</text>
    <text x="446" y="252">mirror the screen</text>
    <text x="596" y="252">·</text>
    <text x="618" y="252">checked flows</text>
    <text x="746" y="252">·</text>
    <text x="768" y="252">mint a signing identity</text>
  </g>

  <g font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12.5">
    <text x="84" y="284" fill="#3fb950">139 tests</text>
    <text x="176" y="284" fill="#30363d">|</text>
    <text x="196" y="284" fill="#7d8590">loopback only</text>
    <text x="316" y="284" fill="#30363d">|</text>
    <text x="336" y="284" fill="#7d8590">no egress but Apple</text>
    <text x="504" y="284" fill="#30363d">|</text>
    <text x="524" y="284" fill="#7d8590">iPhone 17 / iOS 26.6</text>
  </g>
</svg>
