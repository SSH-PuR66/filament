<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Filament — drive a physically connected iPhone from Windows, with no Mac, Xcode, jailbreak or admin">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c1218"/>
      <stop offset="100%" stop-color="#131c24"/>
    </linearGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#1f6feb" stop-opacity="0"/>
      <stop offset="14%"  stop-color="#1f6feb"/>
      <stop offset="52%"  stop-color="#e3b341"/>
      <stop offset="88%"  stop-color="#3fb950"/>
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-400%" width="140%" height="900%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- One filament running the width of the card: host at the left end,
       device at the right. Kept clear of every text baseline. -->
  <path d="M64 246 C 340 246, 380 206, 600 206 S 860 246, 1136 246"
        fill="none" stroke="url(#wire)" stroke-width="3" filter="url(#glow)"/>
  <circle cx="64" cy="246" r="7" fill="#1f6feb"/>
  <circle cx="1136" cy="246" r="7" fill="#3fb950"/>

  <text x="64" y="122" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
        font-size="104" font-weight="700" fill="#e6edf3" letter-spacing="-4">filament</text>

  <text x="70" y="172" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif"
        font-size="30" fill="#adbac7">Drive a physically connected iPhone from Windows.</text>

  <text x="70" y="212" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif"
        font-size="30" font-weight="600" fill="#6e7681">No Mac.<tspan fill="#3d444d">  ·  </tspan><tspan fill="#6e7681">No Xcode.</tspan><tspan fill="#3d444d">  ·  </tspan><tspan fill="#6e7681">No jailbreak.</tspan><tspan fill="#3d444d">  ·  </tspan><tspan fill="#6e7681">No admin.</tspan></text>
</svg>
